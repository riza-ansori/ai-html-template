<!DOCTYPE html>
<html lang="en">
<head>
  <template data-component="head"></template>
  <title>Login - AI Studio</title>
</head>

<body>
    <div data-component="navbar"></div>
    <main>
        <section class="flex min-h-[calc(100vh-5rem)] items-center justify-center px-6 py-20" aria-labelledby="login-title">
            <div class="w-full max-w-md">
                <!-- Header -->
                <div class="text-center">
                    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-accent">
                        Welcome back
                    </p>

                    <h1 id="login-title" class="mt-5 font-serif text-5xl leading-[0.95] tracking-tight sm:text-6xl">
                        Sign in to
                        <span class="text-muted">
                        AI Studio.
                        </span>
                    </h1>

                    <p class="mx-auto mt-6 max-w-sm text-sm leading-6 text-muted">
                        Sign in to continue to your workspace and pick up
                        where you left off.
                    </p>
                </div>

                <!-- Form -->
                <form id="login-form" class="mt-10" novalidate>
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-xs font-semibold">
                            Email address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            class="mt-2 h-11 w-full rounded-md border border-border bg-surface px-3 text-sm outline-none transition-colors placeholder:text-muted/50 focus:border-foreground"
                            placeholder="you@example.com"
                        />

                        <p id="email-error" class="mt-2 hidden text-xs text-red-500" role="alert"></p>
                    </div>

                    <!-- Password -->
                    <div class="mt-5">
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-xs font-semibold">
                                Password
                            </label>

                            <a href="#" class="text-xs text-muted transition-colors hover:text-foreground">
                                Forgot password?
                            </a>
                        </div>

                        <div class="relative mt-2">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                required
                                aria-describedby="password-error"
                                class="h-11 w-full rounded-md border border-border bg-surface px-3 pr-16 text-sm outline-none transition-colors placeholder:text-muted/50 focus:border-foreground"
                                placeholder="Enter your password"
                            />

                            <button
                                type="button"
                                id="toggle-password"
                                class="absolute inset-y-0 right-3 flex items-center justify-center text-muted transition-colors hover:text-foreground"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <!-- Eye -->
                                <svg
                                    data-icon="show"
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                                    <circle cx="12" cy="12" r="2.5" />
                                </svg>

                                <!-- Eye off -->
                                <svg
                                    data-icon="hide"
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="hidden"
                                    aria-hidden="true"
                                >
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-3.1 3.9" />
                                    <path d="M6.7 6.7C4 8.5 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.2 3.6-.7" />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </div>

                        <p id="password-error" class="mt-2 hidden text-xs text-red-500" role="alert" ></p>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="mt-7 inline-flex h-11 w-full items-center justify-center rounded-md bg-foreground px-5 text-xs font-semibold text-background transition-transform duration-200 hover:-translate-y-0.5 hover:bg-accent">
                        Sign in
                    </button>
                </form>

                <!-- Register -->
                <p class="mt-7 text-center text-xs text-muted">
                    Don't have an account?
                    <a href="/register.html" class="font-semibold text-foreground transition-opacity hover:opacity-60">
                        Create one
                    </a>
                </p>
            </div>
        </section>
    </main>
    <div data-component="footer"></div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
